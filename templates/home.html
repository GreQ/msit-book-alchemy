{% extends "base.html" %}
{% block title %}Home | Library{% endblock %}
{% block content %}
    {% for book in books %}
    <div>
      <img
        src="https://covers.openlibrary.org/b/isbn/{{ book.isbn|urlencode }}-M.jpg"
        alt="Cover of {{ book.title }}"
        width="128"
        height="192"
        loading="lazy"
      >
      <h3>{{ book.title }}</h3>
      <b>isbn:</b> {{ book.isbn }} <br>
      <b>year:</b> {{ book.publication_year }} <br>
      <b>author:</b> {{ book.author.name }} <br>
    </div>
    {% endfor %}
{% endblock %}
